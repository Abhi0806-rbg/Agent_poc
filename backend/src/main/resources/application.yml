server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agents}
    username: ${DB_USER:agents}
    password: ${DB_PASSWORD:agents}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  threads:
    virtual:
      enabled: true
logging:
  pattern:
    level: "%5p [run=%X{run_id:-}]"
agent:
  config-dir: ${AGENT_CONFIG_DIR:./config}
  openai-api-key: ${OPENAI_API_KEY:}
  anthropic-api-key: ${ANTHROPIC_API_KEY:}
  embed-dimensions: 384
